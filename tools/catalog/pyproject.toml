[project]
name = "roadhit-catalog"
version = "0.1.0"
description = "Builds the RoadHit song catalog from yearly hit charts"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "rapidfuzz",
    "beautifulsoup4",
]

[project.scripts]
roadhit-catalog = "roadhit_catalog.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roadhit_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
